# inkaPos — virtual host de Nginx (Ubuntu 22.04, PHP 8.4 FPM)
# Servidor: /etc/nginx/sites-available/inkapos  →  /etc/nginx/sites-enabled/inkapos
# certbot --nginx -d pos.inkanet.pro añade despues el bloque 443 y la redireccion.
# Cloudflare delante: en .env poner TRUSTED_PROXIES=* para leer la IP real y https.

server {
    listen 80;
    server_name pos.inkanet.pro;

    root /var/www/inkapos/public;
    index index.php;

    # logos e imágenes de productos (2 MB cada una) con margen
    client_max_body_size 10m;

    access_log /var/log/nginx/inkapos.access.log;
    error_log /var/log/nginx/inkapos.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Inertia envía cabeceras grandes; sin esto Nginx devuelve 502
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        # reportes en PDF pueden tardar
        fastcgi_read_timeout 120;
        # límites de subida SOLO para este sitio: el pool de PHP-FPM 8.4 es compartido
        fastcgi_param PHP_VALUE "upload_max_filesize=8M
post_max_size=10M";
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # nunca servir archivos ocultos ni el storage privado (XML/CDR de SUNAT)
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /storage/app { deny all; }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 30d;
        access_log off;
    }
}

# ---------------------------------------------------------------------------------------------
# Tiendas en línea: {slug}.inkanet.pro  (catálogo público de cada empresa, misma app)
#
# Pasos únicos para encenderlas (no se repiten por cada tienda nueva):
#   1. DNS en Cloudflare: registro A  "*"  ->  IP del servidor, con proxy activado.
#      Los nombres exactos que ya existen (pos, img y los de otros sitios) siguen ganando al comodín.
#   2. Certificado para *.inkanet.pro en el origen. Lo más simple es un certificado de origen de
#      Cloudflare (SSL/TLS -> Origin Server), guardado en /etc/ssl/inkanet/: dura años y no se renueva
#      por DNS. Con el modo SSL "Full" (no estricto) también sirve el certificado que ya existe.
#   3. Este bloque en /etc/nginx/sites-available/inkapos y `nginx -t && systemctl reload nginx`.
#
# server_name con comodín tiene MENOS prioridad que un nombre exacto: pos.inkanet.pro y los vhosts
# de los otros proyectos del servidor no cambian. Sin este bloque, un subdominio desconocido caería
# en el sitio por defecto de Nginx, que puede ser otro proyecto.
# ---------------------------------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl;
    server_name *.inkanet.pro;

    ssl_certificate     /etc/ssl/inkanet/origen.pem;
    ssl_certificate_key /etc/ssl/inkanet/origen.key;

    root /var/www/inkapos/public;
    index index.php;

    access_log /var/log/nginx/inkapos-tiendas.access.log;
    error_log /var/log/nginx/inkapos-tiendas.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 30;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ^~ /storage/app { deny all; }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 30d;
        access_log off;
    }
}
