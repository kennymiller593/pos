# inkaPos — virtual host de Nginx (Ubuntu 22.04, PHP 8.4 FPM)
# Servidor: /etc/nginx/sites-available/inkapos  →  /etc/nginx/sites-enabled/inkapos
# certbot --nginx -d pos.inkanet.pro añade despues el bloque 443 y la redireccion.
# Cloudflare delante: en .env poner TRUSTED_PROXIES=* para leer la IP real y https.

server {
    listen 80;
    server_name pos.inkanet.pro;

    root /var/www/inkapos/public;
    index index.php;

    # logos e imágenes de productos (2 MB cada una) con margen
    client_max_body_size 10m;

    access_log /var/log/nginx/inkapos.access.log;
    error_log /var/log/nginx/inkapos.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Inertia envía cabeceras grandes; sin esto Nginx devuelve 502
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        # reportes en PDF pueden tardar
        fastcgi_read_timeout 120;
        # límites de subida SOLO para este sitio: el pool de PHP-FPM 8.4 es compartido
        fastcgi_param PHP_VALUE "upload_max_filesize=8M
post_max_size=10M";
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # nunca servir archivos ocultos ni el storage privado (XML/CDR de SUNAT)
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /storage/app { deny all; }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 30d;
        access_log off;
    }
}

# ---------------------------------------------------------------------------------------------
# Tiendas en línea: {slug}.inkanet.pro  (catálogo público de cada empresa, misma app de inkaPos)
#
# Encendidas en producción el 2026-10-05. Pasos únicos (no se repiten por cada tienda nueva):
#   1. DNS en Cloudflare: registro A  "*"  ->  IP del servidor, con proxy activado.
#      Los nombres exactos que ya existen (pos, bot, img, mail, www) siguen ganando al comodín.
#   2. Estos dos bloques en /etc/nginx/sites-available/inkapos y `nginx -t && systemctl reload nginx`.
#      Van ANTES de crear el DNS: sin ellos, un subdominio sin dueño cae por HTTP en el sitio por
#      defecto de Nginx (otro proyecto del servidor).
#
# Un nombre con comodín tiene MENOS prioridad que uno exacto: pos.inkanet.pro, bot.inkanet.pro y
# los demás sitios no cambian.
# El certificado es el de pos.inkanet.pro: Cloudflare está delante en modo SSL "Full" (no estricto)
# y pone el suyo, que sí cubre *.inkanet.pro. Si algún día se pasa a "Full (strict)", aquí hay que
# poner un certificado de origen de Cloudflare para *.inkanet.pro.
# ---------------------------------------------------------------------------------------------
#
# Dominios propios (www.agrocampo.com): el cliente apunta su CNAME a tiendas.inkanet.pro (el
# "fallback origin" de Cloudflare for SaaS) y Cloudflare llega aquí con el host del cliente.
# Ningún nombre de este servidor coincide con ese host, así que lo atiende el bloque por defecto:
# el bloque 443 es default_server (en el 80 ya lo era otro sitio del servidor; Cloudflare llega al
# origen solo por 443). Un host sin tienda registrada recibe 404 de inkaPos.
server {
    listen 80;
    server_name *.inkanet.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name *.inkanet.pro;

    ssl_certificate /etc/letsencrypt/live/pos.inkanet.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.inkanet.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/inkapos/public;
    index index.php;

    access_log /var/log/nginx/inkapos-tiendas.access.log;
    error_log /var/log/nginx/inkapos-tiendas.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 30;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ^~ /storage/app { deny all; }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 30d;
        access_log off;
    }
}
