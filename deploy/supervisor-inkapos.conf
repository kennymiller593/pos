# inkaPos — worker de colas (correos de comprobantes, jobs)
# Servidor: /etc/supervisor/conf.d/inkapos.conf
# Alta:     supervisorctl reread && supervisorctl update
# Reinicio: supervisorctl restart inkapos-queue   (NUNCA "restart all": hay otros proyectos)

[program:inkapos-queue]
command=/usr/bin/php8.4 /var/www/inkapos/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/inkapos
user=www-data
autostart=true
autorestart=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/inkapos-queue.log
stdout_logfile_maxbytes=10MB
